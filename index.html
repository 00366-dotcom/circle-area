<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>切開圓形，拼出圓的面積公式</title>
<!-- 字型只用於證書；離線時自動改用 iPad 內建字型 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6EE; --card:#FFFFFF; --ink:#2B2722; --muted:#6B6257; --line:#E6DCCB;
  --orange:#E8913A; --orangeD:#B8661A; --blue:#3D8FC4; --blueD:#1F6698;
  --green:#2E9E6B; --greenL:#E3F4EB; --purple:#7B4FC9; --red:#C8553D; --gold:#B88A3E;
  --font:"PingFang TC","Noto Sans TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.55;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* ---------- 頂部 ---------- */
header.top{display:flex;align-items:center;gap:10px 16px;padding:6px 14px;background:#FFFDF8;border-bottom:1px solid var(--line);flex-wrap:wrap}
.titles{min-width:0;flex:1 1 260px}
.lesson-name{font-weight:800;font-size:17px;color:var(--muted)}
.level-name{font-weight:800;font-size:21px;line-height:1.3}
.dots{display:flex;gap:2px;flex-wrap:wrap}
.dot{width:48px;height:48px;border:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dot span{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;
  background:#EFE8DA;color:#9A8F80;border:2px solid transparent}
.dot.open span{background:#fff;color:var(--ink);border-color:var(--line)}
.dot.done span{background:var(--green);color:#fff}
.dot.cur span{border-color:var(--ink);box-shadow:0 0 0 3px #FFE3BF}
.dot:disabled{cursor:default}

/* ---------- 主區 ---------- */
main.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr)}
.stage-wrap{display:flex;flex-direction:column;min-height:0;padding:10px 12px;gap:8px}
.stage-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stage-tools:empty{display:none}
.tool-label{font-weight:700;color:var(--muted);margin-right:4px}
.stage{flex:1;min-height:0;background:#fff;border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden;touch-action:manipulation}
.stage.draggable{touch-action:none}
.stage svg{width:100%;height:100%;display:block}
.stage canvas{width:100%;height:100%;display:block}
.stage-caption{min-height:52px;padding:6px 10px;background:#FFF8EA;border:1px solid #EFDDB8;border-radius:12px;font-size:18px;line-height:1.45}
.stage-caption:empty{visibility:hidden}
.panel{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 28px;border-left:1px solid var(--line);-webkit-user-select:none;user-select:none}

/* ---------- 底部按鈕 ---------- */
footer.controls{display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#FFFDF8;border-top:1px solid var(--line);flex-wrap:wrap;justify-content:center}
.btn{min-height:52px;min-width:52px;padding:0 18px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:18px;font-weight:800;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 3px 0 var(--orangeD)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blueD)}
.btn.tool{min-height:48px;font-size:17px;padding:0 14px}
.btn.small{min-height:48px;font-size:16px;padding:0 14px}
.btn.next:not(:disabled){background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 3px 0 #1E6E4A}
.btn.next.glow:not(:disabled){animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 3px 0 #1E6E4A,0 0 0 6px rgba(46,158,107,.25)}}

/* ---------- 卡片與題目 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.card-tag{display:inline-block;font-size:14px;font-weight:800;color:#fff;background:var(--muted);border-radius:999px;padding:1px 10px;margin-bottom:6px}
.card-tag.think{background:var(--blue)}
.card-tag.ok{background:var(--green)}
.card-tag.hint{background:var(--gold)}
.think-text{margin:0;font-size:20px;font-weight:700}
.wait{color:var(--muted);background:#F3EEE4;border-radius:12px;padding:10px 12px;margin:0 0 12px}
.q.is-done{border-color:#BFE3CF;background:#FBFFFC}
.q-line,.q-text{font-size:21px;line-height:2.2;margin:0}
.q-text{line-height:1.6;margin-bottom:8px}
.blank{min-width:96px;min-height:48px;padding:0 12px;margin:0 4px;border:none;border-bottom:3px dashed var(--ink);background:#FFF8EA;border-radius:8px 8px 0 0;
  font-size:21px;font-weight:800;vertical-align:middle;cursor:pointer;color:var(--ink)}
.blank.active{background:#FFE6C4;border-bottom-color:var(--orange);border-bottom-style:solid}
.blank.filled{background:#FFF1DC}
.blank.ok{background:var(--greenL);border-bottom:3px solid var(--green);color:#1E6E4A}
.blank:disabled{cursor:default;opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.chip{min-height:52px;min-width:64px;padding:0 18px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:20px;font-weight:800;cursor:pointer}
.chip:active{background:#FFF1DC}
.choices{display:flex;flex-direction:column;gap:10px;margin:6px 0 10px}
.choice{min-height:56px;padding:8px 16px;text-align:left;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:19px;font-weight:700;cursor:pointer;line-height:1.4}
.choice.sel{border-color:var(--orange);background:#FFF3E2}
.choice.ok{border-color:var(--green);background:var(--greenL);color:#1E6E4A}
.choice:disabled{cursor:default;opacity:1}
.fb{margin:8px 0 0;padding:8px 12px;border-radius:12px;font-weight:700}
.fb.ok{background:var(--greenL);color:#1E6E4A}
.fb.wrong{background:#FFF0E4;color:#8A4A12}
.fb.info{background:#EEF5FB;color:#1F5A85}
.hint-list{margin:0;padding-left:22px}
.hint-list li{margin:4px 0}
.hint-card.flash{animation:flash .9s ease 2}
@keyframes flash{50%{background:#FFF3D6}}
.conclude{border-color:#BFE3CF;background:#F6FCF8}
.conclude p{margin:4px 0;font-size:19px;font-weight:700}
.mini-demo{width:100%;max-width:380px;display:block;margin:4px auto;background:#FFFDF8;border-radius:12px;border:1px solid var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;color:var(--muted);margin-top:4px}
.sw{display:inline-block;width:22px;height:14px;border-radius:3px;vertical-align:middle;margin-right:4px}

/* ---------- 算式整理 ---------- */
.derive{background:#FFFDF8;border:1px dashed #D9CCB5;border-radius:14px;padding:8px 12px;margin-top:8px}
.dline{font-size:22px;font-weight:800;margin:8px 0;transition:opacity .4s;line-height:1.9}
.dline.hide{opacity:0}
.tk{display:inline-block;padding:0 9px;border-radius:10px;border:3px solid;background:#fff;margin:0 2px;line-height:1.55}
.tk.d{border-color:var(--orange)}
.tk.div{border-color:var(--green);border-style:dashed}
.tk.pi{border-color:#8A8174;border-style:dotted}
.tk.r{border-color:var(--purple)}
.tk.b{border-color:var(--orange);border-style:double;border-width:4px}
.tk.h{border-color:var(--purple);border-style:double;border-width:4px}
.tgt{opacity:0}
.tgt.shown{opacity:1;transition:opacity .2s}
.grp{border-radius:12px;padding:2px 2px;transition:outline-color .3s;outline:3px solid transparent}
.grp.boxed{outline-color:var(--purple)}
.dnote{font-size:16px;color:var(--muted);margin:6px 0 0;transition:opacity .4s}
.dnote.hide{opacity:0}

/* ---------- 第八關：數字卡與數字鍵盤 ---------- */
.expr{font-size:22px;font-weight:800;display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px;margin:6px 0}
.slotwrap{display:inline-flex;flex-direction:column;align-items:center}
.slot{width:72px;height:60px;border:3px dashed #B9AC97;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#FFFDF8;cursor:pointer}
.slot.filled{border-style:solid;border-color:var(--purple);background:#F5F0FD}
.slot.target{border-color:var(--orange);background:#FFF1DC}
.slot-cap{font-size:14px;color:var(--muted);margin-top:2px;font-weight:700}
.tray{display:flex;gap:14px;min-height:70px;align-items:center;padding:6px 0}
.numcard{width:64px;height:56px;border-radius:12px;background:var(--purple);color:#fff;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;
  cursor:grab;touch-action:none;box-shadow:0 3px 0 #5332A0;border:3px solid transparent}
.numcard.sel{border-color:#FFD08A}
.numcard.ghosted{opacity:.3}
.numcard.flying{position:fixed;z-index:60;pointer-events:none;margin:0}
.slot .numcard{box-shadow:none;cursor:pointer}
.calc-line{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calc-box{min-width:120px;min-height:52px;border:3px solid var(--ink);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;background:#FFF8EA;padding:0 10px}
.calc-box.ok{border-color:var(--green);background:var(--greenL)}
.numpad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;margin:10px 0}
.numpad .btn{min-width:64px;font-size:22px}
.numpad .wide{grid-column:span 3}

/* ---------- SVG 狀態 ---------- */
.piece{cursor:grab}
.piece.selected > path:first-child{stroke:#2B2722;stroke-width:6}
.piece.hint-mark > path:first-child{stroke:#2B2722;stroke-width:6;stroke-dasharray:10 7;animation:pulse .9s ease-in-out 6}
.pulse{animation:pulse .7s ease-in-out 4}
@keyframes pulse{50%{opacity:.25}}
.fade-in{animation:fadein .8s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.snapflash{animation:pulse .25s ease 2}

/* ---------- 提示、對話框 ---------- */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#2B2722;color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(43,39,34,.45);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal-box{background:#fff;border-radius:20px;padding:22px;max-width:440px;width:100%}
.modal-box h3{margin:0 0 8px;font-size:22px}
.modal-box p{margin:0 0 18px;color:var(--muted)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
[hidden]{display:none!important}

/* ---------- 第九關：通關與證書 ---------- */
.celeb-msg{font-size:24px;font-weight:900;line-height:1.6;opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s;margin:0 0 12px}
.celeb-msg.show{opacity:1;transform:none}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:70;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.claim-wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.claim-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.claim-title{font-size:26px;font-weight:900;margin:0}
.name-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}
.name-row label{font-size:20px;font-weight:800}
#nameInput{font-family:var(--font);font-size:24px;min-height:56px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:#fff;width:min(340px,100%);color:var(--ink);-webkit-user-select:text;user-select:text}
#nameInput:focus{outline:none;border-color:var(--blue)}
.note{color:var(--muted);font-size:15px;text-align:center;margin:0}
.cert-frame{background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(60,45,20,.14);overflow:hidden}
#previewCanvas,#resultImg{display:block;width:100%;height:auto}
#resultImg{-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.save-hint{background:#FFF6DF;border:1px solid #EBD39A;color:#6B5320;border-radius:12px;padding:12px 16px;text-align:center}


/* ---------- 封面 ---------- */
.cover{position:fixed;inset:0;z-index:75;background:
  radial-gradient(circle at 85% 12%, #FFE9C9 0, transparent 38%),
  radial-gradient(circle at 8% 92%, #DCEEFA 0, transparent 40%), var(--bg);
  overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
.cover-inner{width:100%;max-width:1080px;margin:auto;display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:center}
.cover-tag{display:inline-block;font-size:15px;font-weight:800;color:var(--orangeD);background:#FFF1DC;border:1px solid #F3D3A6;border-radius:999px;padding:3px 14px;margin-bottom:14px}
.cover h1{margin:0;font-size:clamp(34px,5.2vw,58px);line-height:1.22;font-weight:900;letter-spacing:.02em}
.cover h1 .l2{display:block;color:var(--orangeD)}
.cover-sub{font-size:clamp(17px,2vw,21px);color:var(--muted);margin:14px 0 20px;line-height:1.6}
.route{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;margin:0 0 22px;padding:0;list-style:none}
.route li{font-size:15px;font-weight:800;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.route li.sep{background:none;border:none;padding:0 2px;color:#B9AC97}
.cover-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.cover-actions .btn{min-height:60px;font-size:21px;padding:0 26px}
.cover-note{font-size:15px;color:var(--muted);margin:16px 0 0}
.cover-sign{font-size:15px;color:var(--muted);margin-top:6px;font-weight:700}
.cover-art{background:#fff;border:1px solid var(--line);border-radius:28px;padding:10px;box-shadow:0 14px 34px rgba(80,60,30,.10)}
.cover-art svg{width:100%;height:auto;display:block}
@media (orientation:portrait), (max-width:860px){
  .cover-inner{grid-template-columns:1fr;gap:18px}
  .cover-art{order:-1;max-width:560px;width:100%;margin:0 auto}
}

/* ---------- 直向／窄螢幕 ---------- */
@media (orientation:portrait), (max-width:860px){
  main.main{grid-template-columns:1fr;grid-template-rows:minmax(300px,52%) minmax(0,1fr)}
  .panel{border-left:none;border-top:1px solid var(--line)}
  .level-name{font-size:19px}
}
@media (max-height:640px) and (orientation:landscape){
  .stage-caption{min-height:40px;font-size:16px}
  .level-name{font-size:18px}
}

/* ---------- 列印：只印證書 ---------- */
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{background:#fff;height:auto}
  .app,.overlay,.toast,.modal{display:none!important}
  #printArea{display:flex;align-items:center;justify-content:center;width:100%;height:100vh}
  #printArea img{width:100%;height:100%;object-fit:contain}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<!-- 共用圖樣：藍色扇形加上斜線，不只靠顏色區分 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="hatchB" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#5DA9DD"/><rect width="3.2" height="10" fill="#ffffff" fill-opacity=".32"/>
    </pattern>
    <pattern id="hatchBL" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#C3DFF3"/><rect width="3.2" height="10" fill="#ffffff" fill-opacity=".6"/>
    </pattern>
  </defs>
</svg>

<div class="app" id="app">
  <header class="top">
    <div class="titles">
      <div class="lesson-name">切開圓形，拼出圓的面積公式</div>
      <div class="level-name" id="levelName"></div>
    </div>
    <nav class="dots" id="dots" aria-label="關卡進度"></nav>
    <button class="btn small" id="btnCover">封面</button>
    <button class="btn small" id="btnRestart">重新開始</button>
  </header>

  <main class="main">
    <section class="stage-wrap">
      <div class="stage-tools" id="tools"></div>
      <div class="stage" id="stage"></div>
      <div class="stage-caption" id="caption" aria-live="polite"></div>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>

  <footer class="controls">
    <button class="btn" id="btnPrev">◀ 上一步</button>
    <button class="btn" id="btnReplay">↻ 重播動畫</button>
    <button class="btn" id="btnHint">💡 提示</button>
    <button class="btn" id="btnReset">重設本關</button>
    <button class="btn next" id="btnNext">下一步 ▶</button>
  </footer>
</div>

<!-- 封面 -->
<div class="cover" id="cover" hidden>
  <div class="cover-inner">
    <div>
      <span class="cover-tag">六年級數學・動手探索</span>
      <h1>切開圓形，<span class="l2">拼出圓的面積公式</span></h1>
      <p class="cover-sub">把圓切成扇形、自己動手拼一拼，<br>從觀察「底」和「高」，一步步找出圓面積的秘密。</p>
      <ol class="route" aria-label="學習路線">
        <li>切開</li><li class="sep" aria-hidden="true">›</li>
        <li>拼貼</li><li class="sep" aria-hidden="true">›</li>
        <li>切得更細</li><li class="sep" aria-hidden="true">›</li>
        <li>找底和高</li><li class="sep" aria-hidden="true">›</li>
        <li>推導公式</li><li class="sep" aria-hidden="true">›</li>
        <li>領證書</li>
      </ol>
      <div class="cover-actions" id="coverActions"></div>
      <p class="cover-note">共 9 關・建議橫向使用 iPad・進度會自動保存在這台裝置</p>
      <p class="cover-sign">峻瑋老師</p>
    </div>
    <div class="cover-art"><svg id="coverArt" viewBox="0 0 520 420" role="img" aria-label="圓被切成扇形，再上下交錯排列"></svg></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<div class="modal" id="confirmModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="cfTitle">
    <h3 id="cfTitle"></h3>
    <p id="cfMsg"></p>
    <div class="modal-actions">
      <button class="btn" id="cfCancel">取消</button>
      <button class="btn primary" id="cfOk">確定</button>
    </div>
  </div>
</div>

<!-- 證書領取 -->
<div class="overlay" id="certOverlay" hidden>
  <div class="claim-wrap">
    <div class="claim-head">
      <h2 class="claim-title" id="claimTitle">寫上你的名字</h2>
      <button class="btn small" id="btnCloseCert">回到課程</button>
    </div>
    <div id="stepName" style="display:flex;flex-direction:column;gap:12px">
      <div class="name-row">
        <label for="nameInput">姓名</label>
        <input id="nameInput" type="text" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="例如：王小明">
        <button class="btn primary" id="btnGenerate" disabled>產生證書</button>
      </div>
      <p class="note">下方是證書預覽，確認名字正確後再按「產生證書」。名字只存在這台 iPad 上，不會上傳。</p>
      <div class="cert-frame"><canvas id="previewCanvas" width="1000" height="707"></canvas></div>
    </div>
    <div id="stepResult" style="display:flex;flex-direction:column;gap:12px" hidden>
      <div class="cert-frame"><img id="resultImg" alt="圓面積探索家通關證書"></div>
      <p class="save-hint" id="saveHint" hidden>請用手指長按上方的證書圖片，選擇「加入照片」或「儲存影像」。</p>
      <div class="actions">
        <button class="btn primary" id="btnDownload">下載證書圖片</button>
        <button class="btn blue" id="btnShare" hidden>分享證書</button>
        <button class="btn" id="btnPrint">列印證書</button>
        <button class="btn" id="btnEdit">修改姓名</button>
      </div>
    </div>
  </div>
</div>

<div id="printArea"><img id="printImg" alt=""></div>

<script>
(function(){
'use strict';

/* =========================================================
   基本設定
   ========================================================= */
const KEY = 'circleAreaLesson.progress.v1';
const CERT_KEY = 'circleAreaExplorer.certificate.v1';
const VB_W = 1000, VB_H = 600;
const COL = { o:'#F0A04B', oL:'#F8CF9C', oD:'#B8661A', b:'#5DA9DD', bD:'#1F6698', ink:'#2B2722', muted:'#6B6257',
              green:'#2E9E6B', purple:'#7B4FC9', paper:'#FFFDF8', faint:'#F4EEE2', line:'#CDBFA8' };
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const NS = 'http://www.w3.org/2000/svg';

const $ = (s, el) => (el || document).querySelector(s);
function S_(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in (attrs || {})) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function H(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs || {})){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'disabled') e.disabled = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => { if (c == null || c === false) return; e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
const lerp = (a,b,t) => a + (b-a)*t;
const clamp01 = t => Math.max(0, Math.min(1, t));
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const lin = t => t;
const normRot = r => ((Math.round(r) % 360) + 360) % 360;

/* =========================================================
   動畫控制：新的動畫會讓舊的停止
   ========================================================= */
let animId = 0, demoId = 0, deriveId = 0;
function newAnim(){
  const id = ++animId;
  const alive = () => id === animId;
  const tw = (ms, step, e) => new Promise(res => {
    e = e || ease;
    if (!alive()){ res(false); return; }
    if (reduceMotion || ms <= 0){ step(1); res(alive()); return; }
    const t0 = performance.now();
    const f = now => {
      if (!alive()){ res(false); return; }
      const k = Math.min(1, (now - t0) / ms);
      step(e(k));
      if (k < 1) requestAnimationFrame(f); else res(true);
    };
    requestAnimationFrame(f);
  });
  const wait = ms => tw(ms, () => {}, lin);
  return { alive, tw, wait };
}

/* =========================================================
   幾何：所有圖形都由同一組資料產生
   扇形的本地座標：尖端在 (0,0)，弧在下方（尖端朝上）
   ========================================================= */
function sectorPath(R, thDeg){
  const a = thDeg/2 * Math.PI/180, x = R*Math.sin(a), y = R*Math.cos(a);
  return `M0 0 L${x.toFixed(3)} ${y.toFixed(3)} A${R} ${R} 0 0 1 ${(-x).toFixed(3)} ${y.toFixed(3)} Z`;
}
function arcPath(R, thDeg){
  const a = thDeg/2 * Math.PI/180, x = R*Math.sin(a), y = R*Math.cos(a);
  return `M${x.toFixed(3)} ${y.toFixed(3)} A${R} ${R} 0 0 1 ${(-x).toFixed(3)} ${y.toFixed(3)}`;
}
// 圓上第 i 片：分角線方向 φ = offset + i·360/n（螢幕座標，0° 向右、90° 向下）
function circlePoses(n, cx, cy, offsetDeg, explode){
  return Array.from({length:n}, (_, i) => {
    const phi = offsetDeg + i*360/n, r = phi*Math.PI/180;
    return { x: cx + (explode||0)*Math.cos(r), y: cy + (explode||0)*Math.sin(r), rot: phi - 90 };
  });
}
// 交錯拼排：下半圓（i < n/2）尖端朝上排在下排，上半圓尖端朝下排在上排
function rowLayout(n, R, cx, cy){
  const th = 2*Math.PI/n, half = n/2;
  const c = 2*R*Math.sin(th/2), h = R*Math.cos(th/2);
  const width = half*c + c/2, x0 = cx - width/2, top = cy - h/2;
  const poses = [];
  for (let i = 0; i < n; i++){
    if (i < half){ const k = half-1-i; poses.push({ x: x0 + c/2 + k*c, y: top, rot: 0 }); }
    else { const k = i-half; poses.push({ x: x0 + c + k*c, y: top + h, rot: 180 }); }
  }
  return { poses, c, h, width, x0, top, half, R, n,
    TL:{x:x0+c/2, y:top}, TR:{x:x0+width, y:top}, BR:{x:x0+half*c, y:top+h}, BL:{x:x0, y:top+h} };
}
function setPose(p, pose){
  p.x = pose.x; p.y = pose.y; p.rot = pose.rot;
  p.g.setAttribute('transform', `translate(${pose.x.toFixed(2)} ${pose.y.toFixed(2)}) rotate(${pose.rot.toFixed(2)})`);
}
const lerpPose = (a,b,t) => ({ x:lerp(a.x,b.x,t), y:lerp(a.y,b.y,t), rot:lerp(a.rot,b.rot,t) });
function movePieces(a, pieces, from, to, ms, stagger){
  stagger = stagger || 0;
  const total = ms + stagger*(pieces.length-1);
  return a.tw(total, k => {
    const t = k*total;
    pieces.forEach((p, i) => setPose(p, lerpPose(from[i], to[i], ease(clamp01((t - i*stagger)/ms)))));
  }, lin);
}
function makePieces(parent, n, R, colorOf, opt){
  opt = opt || {};
  const th = 360/n, d = sectorPath(R, th), ad = arcPath(R, th);
  const sw = opt.sw != null ? opt.sw : (n >= 32 ? 1 : 2.5);
  return Array.from({length:n}, (_, i) => {
    const col = colorOf(i);
    const g = S_('g', { class:'piece' }, parent);
    const fill = col === 'o' ? (opt.light ? COL.oL : COL.o) : (opt.light ? 'url(#hatchBL)' : 'url(#hatchB)');
    const body = S_('path', { d, fill, stroke:'#fff', 'stroke-width':sw, 'stroke-linejoin':'round' }, g);
    let arc = null;
    if (opt.arcs){
      arc = S_('path', { d:ad, fill:'none', stroke: col === 'o' ? COL.oD : COL.bD, 'stroke-width': n >= 32 ? 4 : 6,
        'stroke-linecap':'butt', 'stroke-dasharray': col === 'o' ? null : '10 6' }, g);
    }
    return { g, body, arc, i, col, x:0, y:0, rot:0 };
  });
}
function txt(parent, x, y, str, a){
  const t = S_('text', Object.assign({ x, y, 'text-anchor':'middle', 'font-size':24, fill:COL.ink, 'font-weight':800,
    'font-family':'PingFang TC, Noto Sans TC, Heiti TC, sans-serif', 'paint-order':'stroke', stroke:'#fff', 'stroke-width':6, 'stroke-linejoin':'round' }, a || {}), parent);
  t.textContent = str;
  return t;
}
function line(parent, x1, y1, x2, y2, a){ return S_('line', Object.assign({ x1, y1, x2, y2, stroke:COL.ink, 'stroke-width':3, 'stroke-linecap':'round' }, a || {}), parent); }
function polyPath(pts){ return 'M' + pts.map(p => p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' L') + ' Z'; }
function vMarker(parent, x, y1, y2, color, dashed){
  const g = S_('g', {}, parent);
  line(g, x, y1, x, y2, { stroke:color, 'stroke-width':4, 'stroke-dasharray': dashed ? '8 6' : null });
  line(g, x-10, y1, x+10, y1, { stroke:color, 'stroke-width':3 });
  line(g, x-10, y2, x+10, y2, { stroke:color, 'stroke-width':3 });
  return g;
}
function pulse(el){ if (!el) return; el.classList.remove('pulse'); void el.getBoundingClientRect(); el.classList.add('pulse'); }

/* =========================================================
   狀態與儲存
   ========================================================= */
function freshState(){ return { current:0, levels:{} }; }
function loadState(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.levels && typeof s.current === 'number') return s; } catch(e){}
  return freshState();
}
let S = loadState();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
let T = {};   // 暫時狀態（填到一半的答案、答錯次數），不需儲存
function lvl(i){ const k = LEVELS[i].key; return S.levels[k] || (S.levels[k] = { done:false, ans:{}, hints:[] }); }
function unlocked(i){ for (let j = 0; j < i; j++) if (!lvl(j).done) return false; return true; }
function tq(L, q){ const k = L.key + ':' + q.id; return T[k] || (T[k] = { vals:null, active:0, wrong:0, hintIdx:0, msg:'', msgType:'' }); }

/* =========================================================
   DOM 參照、提示訊息、確認框
   ========================================================= */
const stageEl = $('#stage'), toolsEl = $('#tools'), captionEl = $('#caption'), panel = $('#panel');
function newStage(){
  stageEl.innerHTML = ''; toolsEl.innerHTML = ''; captionEl.innerHTML = '';
  stageEl.classList.remove('draggable');
  const svg = S_('svg', { viewBox:`0 0 ${VB_W} ${VB_H}`, preserveAspectRatio:'xMidYMid meet', role:'img', 'aria-label':'操作與動畫區' });
  stageEl.appendChild(svg);
  return svg;
}
function caption(html){ captionEl.innerHTML = html; }
let toastTimer = 0;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function confirmDialog(title, msg, okText){
  return new Promise(res => {
    const m = $('#confirmModal');
    $('#cfTitle').textContent = title; $('#cfMsg').textContent = msg; $('#cfOk').textContent = okText || '確定';
    m.hidden = false;
    const done = v => { m.hidden = true; $('#cfOk').onclick = null; $('#cfCancel').onclick = null; res(v); };
    $('#cfOk').onclick = () => done(true);
    $('#cfCancel').onclick = () => done(false);
  });
}
function wait(ms){ return new Promise(r => setTimeout(r, reduceMotion ? 0 : ms)); }

/* =========================================================
   算式整理動畫：把詞卡從一行「飛」到下一行
   ========================================================= */
function flyClone(from, to){
  return new Promise(res => {
    const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
    if (reduceMotion || !a.width || !b.width){ to.classList.add('shown'); res(); return; }
    const cl = from.cloneNode(true);
    cl.classList.remove('tgt'); cl.classList.add('shown');
    Object.assign(cl.style, { position:'fixed', left:a.left+'px', top:a.top+'px', width:a.width+'px', height:a.height+'px', margin:'0',
      zIndex:'60', pointerEvents:'none', transition:'transform .7s cubic-bezier(.4,0,.2,1)', boxSizing:'border-box', display:'inline-flex',
      alignItems:'center', justifyContent:'center', whiteSpace:'nowrap' });
    document.body.appendChild(cl);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const sx = b.width / a.width;
      cl.style.transformOrigin = '0 0';
      cl.style.transform = `translate(${b.left-a.left}px, ${b.top-a.top}px) scale(${sx}, ${b.height/a.height})`;
    }));
    setTimeout(() => { cl.remove(); to.classList.add('shown'); res(); }, 760);
  });
}
const tk = (text, cls) => H('span', { class:'tk ' + cls }, text);

/* =========================================================
   第一關：切開後，面積有改變嗎？
   ========================================================= */
const L1 = {
  key:'l1', title:'切開後，面積有改變嗎？',
  think:'圓被切開了，但沒有拿走任何一片。這些扇形的總面積，有改變嗎？',
  ready: st => !!st.introSeen,
  waitText: () => '先看動畫：圓被平均切成 8 片。',
  questions:[{
    id:'q1', text:'切開後的總面積，和原來的圓面積[[0]]。', answers:[['相同']], options:['相同','不同'],
    clue:'數一數：切開後還是 8 片，有沒有哪一片被拿走呢？',
    clue2:'看畫面上的編號：1 到 8 片都還在，合起來就是原來的圓。',
    hints:['切開只改變「形狀」，沒有加進或拿走任何部分。','如果把 8 片全部合起來，會變回什麼？'],
    praise:'答對了！切開前後，用的是同樣的 8 片。',
    onWrong2: () => L1.numbers(),
    onCorrect: () => L1.mergeAgain()
  }],
  conclusion: () => '形狀改變，總面積保持相同。',
  mount(st){
    const svg = newStage(); this.R = 190; const cx = 500, cy = 290;
    S_('circle', { cx, cy, r:this.R, fill:'none', stroke:COL.line, 'stroke-width':2, 'stroke-dasharray':'6 8' }, svg);
    const g = S_('g', {}, svg);
    this.pieces = makePieces(g, 8, this.R, i => i % 2 ? 'b' : 'o', { sw:0 });
    this.base = circlePoses(8, cx, cy, 22.5, 0);
    this.ex = circlePoses(8, cx, cy, 22.5, 46);
    this.numLayer = S_('g', { 'pointer-events':'none' }, svg);
    if (st.introSeen){
      this.pieces.forEach((p, i) => { setPose(p, this.ex[i]); p.body.setAttribute('stroke-width', 4); });
      caption(st.done ? '<b>形狀改變，總面積保持相同。</b>' : '8 片扇形都還在畫面上。想一想：總面積有改變嗎？');
    } else this.intro();
  },
  async intro(){
    const a = newAnim(), ps = this.pieces;
    this.numLayer.innerHTML = '';
    ps.forEach((p, i) => { setPose(p, this.base[i]); p.body.setAttribute('stroke-width', 0); });
    caption('這是一個完整的圓。');
    if (!await a.wait(900)) return;
    caption('把圓<b>平均</b>切成 8 片扇形，顏色交替（藍色加斜線）。');
    if (!await a.tw(900, k => ps.forEach(p => p.body.setAttribute('stroke-width', 4*k)))) return;
    if (!await a.wait(500)) return;
    caption('扇形慢慢分開，8 片都還留在畫面上。');
    if (!await movePieces(a, ps, this.base, this.ex, 2000)) return;
    const st = lvl(0);
    if (!st.introSeen){ st.introSeen = true; save(); renderPanel(true); }
    caption('想一想：總面積有改變嗎？');
  },
  replay(){ this.intro(); },
  numbers(){
    this.numLayer.innerHTML = '';
    this.ex.forEach((p, i) => {
      const r = p.rot*Math.PI/180, d = this.R*0.62;
      txt(this.numLayer, p.x - d*Math.sin(r), p.y + d*Math.cos(r) + 9, String(i+1), { 'font-size':28 });
    });
    caption('數一數：1、2、3……8，<b>一片都沒有少</b>。');
  },
  async mergeAgain(){
    const a = newAnim(), ps = this.pieces;
    ps.forEach((p, i) => { setPose(p, this.ex[i]); p.body.setAttribute('stroke-width', 4); });
    caption('把 8 片合回去……');
    if (!await movePieces(a, ps, this.ex, this.base, 1100)) return;
    caption('剛好變回原來的圓！');
    if (!await a.wait(900)) return;
    caption('再分開一次……');
    if (!await movePieces(a, ps, this.base, this.ex, 1100)) return;
    caption('<b>形狀改變，總面積保持相同。</b>');
  }
};

/* =========================================================
   第二關：自己拼出熟悉的形狀（拖曳、旋轉、吸附）
   ========================================================= */
const L2 = {
  key:'l2', title:'自己拼出熟悉的形狀',
  think:'能不能把這些扇形，拼成接近我們學過的圖形？',
  R:130, N:8,
  init(){ const a = Math.PI/8; this.C = 2*this.R*Math.sin(a); this.Hh = this.R*Math.cos(a); this.D = 2*this.R*Math.sin(a)/(3*a); },
  startPoses(){ return circlePoses(8, 215, 300, 0, 26).map(p => ({ x:p.x, y:p.y, rot:normRot(p.rot) })); },
  ready: st => !!st.assembled,
  extraDone: st => !!st.assembled,
  questions:[{
    id:'q1', text:'拼出的圖形，接近[[0]]。', answers:[['平行四邊形']], options:['平行四邊形','三角形','圓形'],
    clue:'看看虛線外框：上下兩條邊是什麼關係？',
    clue2:'沿著虛線外框看：上下兩條邊互相平行，左右兩條斜邊也互相平行。',
    hints:['數一數虛線外框有幾個角、幾條邊。','上下兩條邊平行，左右兩條斜邊也平行。'],
    praise:'答對了！它很接近平行四邊形。',
    onCorrect: () => L2.celebrateShape(),
    onWrong2: () => L2.pulseOutline()
  }],
  conclusion: () => '扇形尖端上下交錯，可以拼成「近似」平行四邊形；邊緣仍是原本彎彎的弧邊。',
  centroid(p){ const r = p.rot*Math.PI/180; return { x:p.x - this.D*Math.sin(r), y:p.y + this.D*Math.cos(r) }; },
  apexAt(c, rot){ const r = rot*Math.PI/180; return { x:c.x + this.D*Math.sin(r), y:c.y - this.D*Math.cos(r), rot }; },
  clampPose(p){
    const c = this.centroid(p);
    return this.apexAt({ x:Math.min(VB_W-28, Math.max(28, c.x)), y:Math.min(VB_H-28, Math.max(28, c.y)) }, p.rot);
  },
  mount(st){
    this.st = st;
    if (!st.poses || st.poses.length !== 8){ st.poses = this.startPoses(); save(); }
    const svg = newStage(); this.svg = svg;
    stageEl.classList.toggle('draggable', !st.assembled);
    S_('rect', { x:430, y:40, width:555, height:520, rx:24, fill:'#FBF7EF', stroke:'#D9CCB5', 'stroke-width':2, 'stroke-dasharray':'8 8' }, svg);
    txt(svg, 456, 78, '拼貼區', { 'text-anchor':'start', 'font-size':22, fill:COL.muted, 'font-weight':700, stroke:'none' });
    txt(svg, 215, 520, '切開的 8 片扇形', { 'font-size':22, fill:COL.muted, 'font-weight':700, stroke:'none' });
    this.ghostG = S_('g', { 'pointer-events':'none' }, svg);
    this.layer = S_('g', {}, svg);
    this.outlineG = S_('g', { 'pointer-events':'none' }, svg);
    this.markG = S_('g', { 'pointer-events':'none' }, svg);
    this.pieces = makePieces(this.layer, 8, this.R, i => i % 2 ? 'b' : 'o', { sw:3 });
    this.pieces.forEach((p, i) => { p.g.dataset.i = i; setPose(p, st.poses[i]); });
    this.sel = -1; this.ghost = null; this.drag = null;
    this.buildTools();
    if (st.assembled){
      this.drawOutline(false);
      caption('拼好了！虛線是近似平行四邊形的外框，扇形仍保留原本的弧邊。');
    } else {
      caption('把扇形拖到拼貼區，試著拼出學過的圖形。也可以先點一片，再點想放的位置。');
      this.bind();
    }
  },
  buildTools(){
    toolsEl.innerHTML = '';
    if (this.st.assembled) return;
    this.selLabel = H('span', { class:'tool-label' }, '');
    const mk = (label, fn, aria) => H('button', { class:'btn tool', onclick:fn, 'aria-label':aria || label }, label);
    this.toolBtns = [
      mk('↺ 轉45°', () => this.rotateSel(-45), '逆時針轉 45 度'),
      mk('↻ 轉45°', () => this.rotateSel(45), '順時針轉 45 度'),
      mk('旋轉180°', () => this.rotateSel(180)),
      mk('移回原處', () => this.returnSel())
    ];
    toolsEl.append(this.selLabel, ...this.toolBtns);
    this.refreshTools();
  },
  refreshTools(){
    const on = this.sel >= 0 && !this.st.assembled;
    (this.toolBtns || []).forEach(b => b.disabled = !on);
    if (this.selLabel) this.selLabel.textContent = on ? '已選取 1 片：' : '點一片扇形來選取';
    this.pieces.forEach((p, i) => p.g.classList.toggle('selected', i === this.sel));
  },
  select(i){ this.sel = i; this.refreshTools(); },
  svgPt(e){ const pt = this.svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(this.svg.getScreenCTM().inverse()); },
  bind(){
    const svg = this.svg;
    svg.addEventListener('pointerdown', e => {
      if (this.st.assembled || this.drag) return;
      const pg = e.target.closest && e.target.closest('.piece');
      const idx = pg ? +pg.dataset.i : -1;
      const pt = this.svgPt(e);
      this.drag = { id:e.pointerId, idx, sx:e.clientX, sy:e.clientY, start:pt, moved:false, orig: idx >= 0 ? Object.assign({}, this.st.poses[idx]) : null };
      if (idx >= 0) this.layer.appendChild(this.pieces[idx].g);   // 拖曳的扇形放到最上層
      try { svg.setPointerCapture(e.pointerId); } catch(err){}
      e.preventDefault();
    });
    svg.addEventListener('pointermove', e => {
      const d = this.drag;
      if (!d || e.pointerId !== d.id) return;
      if (!d.moved && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 8) d.moved = true;
      if (d.moved && d.idx >= 0){
        const pt = this.svgPt(e);
        const np = this.clampPose({ x:d.orig.x + pt.x - d.start.x, y:d.orig.y + pt.y - d.start.y, rot:d.orig.rot });
        this.st.poses[d.idx] = np; setPose(this.pieces[d.idx], np);
        if (this.sel !== d.idx) this.select(d.idx);
      }
      e.preventDefault();
    });
    const end = e => {
      const d = this.drag;
      if (!d || e.pointerId !== d.id) return;
      this.drag = null;
      if (e.type === 'pointercancel'){ if (d.idx >= 0) this.afterPlace(d.idx); return; }
      if (!d.moved){
        if (d.idx >= 0) this.select(this.sel === d.idx ? -1 : d.idx);
        else if (this.sel >= 0) this.moveSelTo(this.svgPt(e));
      } else if (d.idx >= 0) this.afterPlace(d.idx);
    };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
  },
  async moveSelTo(pt){
    const i = this.sel, from = Object.assign({}, this.st.poses[i]);
    const to = this.clampPose(this.apexAt({ x:pt.x, y:pt.y }, from.rot));
    this.layer.appendChild(this.pieces[i].g);
    const a = newAnim();
    await a.tw(260, k => setPose(this.pieces[i], lerpPose(from, to, k)));
    this.st.poses[i] = to; setPose(this.pieces[i], to);
    this.afterPlace(i);
  },
  async rotateSel(delta){
    if (this.sel < 0 || this.st.assembled) return;
    const i = this.sel, p = Object.assign({}, this.st.poses[i]), c = this.centroid(p);
    const a = newAnim();
    await a.tw(240, k => setPose(this.pieces[i], this.apexAt(c, p.rot + delta*k)));
    this.st.poses[i] = this.clampPose(this.apexAt(c, normRot(p.rot + delta)));
    setPose(this.pieces[i], this.st.poses[i]);
    this.afterPlace(i);
  },
  returnSel(){
    if (this.sel < 0) return;
    const i = this.sel; this.st.poses[i] = this.startPoses()[i];
    setPose(this.pieces[i], this.st.poses[i]); save(); this.clearGhostIfFilled();
  },
  candidates(idx, rot){
    const C = this.C, Hh = this.Hh, out = [];
    this.st.poses.forEach((p, j) => {
      if (j === idx) return;
      const r = normRot(p.rot);
      if (r === 0){
        if (rot === 180) out.push({ x:p.x + C/2, y:p.y + Hh }, { x:p.x - C/2, y:p.y + Hh });
        else if (rot === 0) out.push({ x:p.x + C, y:p.y }, { x:p.x - C, y:p.y });
      } else if (r === 180){
        if (rot === 0) out.push({ x:p.x + C/2, y:p.y - Hh }, { x:p.x - C/2, y:p.y - Hh });
        else if (rot === 180) out.push({ x:p.x + C, y:p.y }, { x:p.x - C, y:p.y });
      }
    });
    if (this.ghost && this.ghost.rot === rot) out.push({ x:this.ghost.x, y:this.ghost.y });
    return out.filter(c => !this.st.poses.some((p, j) => j !== idx && normRot(p.rot) === rot && Math.hypot(p.x - c.x, p.y - c.y) < 4));
  },
  afterPlace(i){
    const p = this.st.poses[i], r = normRot(p.rot);
    p.rot = r;
    if (r === 0 || r === 180){
      let best = null, bd = 1e9;
      for (const c of this.candidates(i, r)){ const d = Math.hypot(c.x - p.x, c.y - p.y); if (d < bd){ bd = d; best = c; } }
      if (best && bd <= this.R*0.45){
        const tgt = { x:best.x, y:best.y, rot:r }, cc = this.centroid(tgt);
        if (cc.x > 20 && cc.x < VB_W-20 && cc.y > 20 && cc.y < VB_H-20){
          this.st.poses[i] = tgt; setPose(this.pieces[i], tgt);
          const body = this.pieces[i].body; body.classList.remove('snapflash'); void body.getBoundingClientRect(); body.classList.add('snapflash');
        }
      }
    }
    save();
    this.clearGhostIfFilled();
    if (this.isComplete()) this.onAssembled();
  },
  isComplete(){
    const C = this.C, Hh = this.Hh, tol = 6;
    const ps = this.st.poses.map(p => ({ x:p.x, y:p.y, r:normRot(p.rot) }));
    if (ps.some(p => p.r !== 0 && p.r !== 180)) return false;
    ps.sort((a, b) => a.x - b.x);
    const ups = ps.filter(p => p.r === 0), downs = ps.filter(p => p.r === 180);
    if (ups.length !== 4 || downs.length !== 4) return false;
    const yu = ups[0].y, yd = downs[0].y;
    if (ups.some(p => Math.abs(p.y - yu) > tol) || downs.some(p => Math.abs(p.y - yd) > tol)) return false;
    if (Math.abs(yd - yu - Hh) > tol) return false;
    for (let k = 1; k < ps.length; k++){
      if (ps[k].r === ps[k-1].r) return false;
      if (Math.abs(ps[k].x - ps[k-1].x - C/2) > tol) return false;
    }
    return true;
  },
  checkBtn(){
    if (this.isComplete()){ this.onAssembled(); return; }
    T.l2msg = '再試著調整方向或位置。' + ((this.st.hintLevel || 0) === 0 ? '需要的話可以按「提示」。' : '');
    renderPanel();
  },
  onAssembled(){
    const st = this.st;
    if (st.assembled) return;
    // 對齊成精確位置（只平移，不改變形狀）
    const order = st.poses.map((p, i) => ({ i, x:p.x })).sort((a, b) => a.x - b.x);
    const first = st.poses[order[0].i], yu = normRot(first.rot) === 0 ? first.y : first.y - this.Hh;
    order.forEach((o, k) => { const p = st.poses[o.i]; p.x = first.x + k*this.C/2; p.y = normRot(p.rot) === 0 ? yu : yu + this.Hh; setPose(this.pieces[o.i], p); });
    st.assembled = true; this.sel = -1; this.ghost = null; this.ghostG.innerHTML = ''; this.markG.innerHTML = '';
    T.l2msg = '';
    save();
    stageEl.classList.remove('draggable');
    this.buildTools(); this.refreshTools();
    this.drawOutline(true);
    caption('拼好了！虛線是近似的外框；扇形仍保留原本的弧邊。');
    toast('拼好了！看看它像什麼圖形。');
    renderPanel(true);
  },
  outlinePts(){
    const C = this.C, Hh = this.Hh;
    const ps = this.st.poses.map(p => ({ x:p.x, y:p.y, r:normRot(p.rot) })).sort((a, b) => a.x - b.x);
    const L = ps[0], Rr = ps[ps.length-1];
    const yu = L.r === 0 ? L.y : L.y - Hh;
    const TL = L.r === 0 ? { x:L.x, y:yu } : { x:L.x - C/2, y:yu };
    const BL = L.r === 0 ? { x:L.x - C/2, y:yu + Hh } : { x:L.x, y:yu + Hh };
    const TR = Rr.r === 0 ? { x:Rr.x, y:yu } : { x:Rr.x + C/2, y:yu };
    const BR = Rr.r === 0 ? { x:Rr.x + C/2, y:yu + Hh } : { x:Rr.x, y:yu + Hh };
    return { pts:[TL, TR, BR, BL], yu };
  },
  drawOutline(animate){
    this.outlineG.innerHTML = '';
    const o = this.outlinePts();
    this.outlinePath = S_('path', { d:polyPath(o.pts), fill:'none', stroke:COL.ink, 'stroke-width':3.5, 'stroke-dasharray':'12 9', 'stroke-linejoin':'round', class: animate ? 'fade-in' : null }, this.outlineG);
    if (lvl(1).ans.q1) this.shapeLabel(o);
  },
  shapeLabel(o){
    o = o || this.outlinePts();
    let y = o.yu + this.R + 44;
    if (y > VB_H - 14) y = o.yu + this.Hh - this.R - 22;
    const cx = (o.pts[0].x + o.pts[1].x + o.pts[2].x + o.pts[3].x) / 4;
    txt(this.outlineG, cx, y, '近似平行四邊形（邊緣仍是弧）', { 'font-size':24, class:'fade-in' });
  },
  pulseOutline(){ pulse(this.outlinePath); caption('沿著虛線看：上下兩條邊平行，左右兩條斜邊也平行。'); },
  celebrateShape(){ this.drawOutline(false); pulse(this.outlinePath); caption('<b>近似平行四邊形</b>：上下兩組弧邊大致成直線，左右兩條斜邊平行。'); },
  components(){
    const C = this.C, Hh = this.Hh;
    const ps = this.st.poses.map((p, i) => ({ i, x:p.x, y:p.y, r:normRot(p.rot) })).filter(p => p.r === 0 || p.r === 180);
    const adj = (a, b) => {
      if (a.r !== b.r){
        const up = a.r === 0 ? a : b, dn = a.r === 0 ? b : a;
        return Math.abs(Math.abs(dn.x - up.x) - C/2) < 4 && Math.abs(dn.y - up.y - Hh) < 4;
      }
      return Math.abs(a.y - b.y) < 4 && Math.abs(Math.abs(a.x - b.x) - C) < 4;
    };
    const seen = new Set(), comps = [];
    ps.forEach(p => {
      if (seen.has(p.i)) return;
      const comp = [], stack = [p]; seen.add(p.i);
      while (stack.length){ const q = stack.pop(); comp.push(q); ps.forEach(o => { if (!seen.has(o.i) && adj(q, o)){ seen.add(o.i); stack.push(o); } }); }
      comps.push(comp);
    });
    return comps;
  },
  freeSpot(p){
    const c = this.centroid(p);
    if (c.x < 30 || c.x > VB_W - 30 || c.y < 30 || c.y > VB_H - 30) return false;
    return !this.st.poses.some(q => normRot(q.rot) === p.rot && Math.hypot(q.x - p.x, q.y - p.y) < 4);
  },
  nextGhost(){
    const C = this.C, Hh = this.Hh;
    const comps = this.components().filter(cp => cp.some(p => this.centroid({ x:p.x, y:p.y, rot:p.r }).x > 420));
    comps.sort((a, b) => b.length - a.length);
    if (!comps.length){
      const g = { x:500, y:230, rot:0 };
      return this.freeSpot(g) ? g : { x:500 + C, y:230, rot:0 };
    }
    const s = comps[0].slice().sort((a, b) => a.x - b.x);
    const nxt = e => e.r === 0 ? { x:e.x + C/2, y:e.y + Hh, rot:180 } : { x:e.x + C/2, y:e.y - Hh, rot:0 };
    const prv = e => e.r === 0 ? { x:e.x - C/2, y:e.y + Hh, rot:180 } : { x:e.x - C/2, y:e.y - Hh, rot:0 };
    for (let k = 1; k < s.length; k++){                        // 先補中間的空隙
      if (s[k].x - s[k-1].x > C/2 + 4){ const g = nxt(s[k-1]); if (this.freeSpot(g)) return g; }
    }
    const right = nxt(s[s.length-1]); if (this.freeSpot(right)) return right;
    const left = prv(s[0]); if (this.freeSpot(left)) return left;
    return null;
  },
  showGhost(){
    this.ghostG.innerHTML = '';
    const g = this.nextGhost();
    this.ghost = g;
    if (!g){ caption('目前沒有找到合適的下一個位置，試著把扇形移到拼貼區再按提示。'); return; }
    const gg = S_('g', { transform:`translate(${g.x} ${g.y}) rotate(${g.rot})`, class:'fade-in' }, this.ghostG);
    S_('path', { d:sectorPath(this.R, 45), fill:'rgba(43,39,34,.07)', stroke:COL.ink, 'stroke-width':3, 'stroke-dasharray':'7 6' }, gg);
    const c = this.centroid(g);
    txt(this.ghostG, c.x, c.y + 8, '下一片', { 'font-size':20, fill:COL.muted });
    caption('淡色輪廓是「下一片」可以放的位置：自己選一片、轉好方向，再拖過去。');
  },
  clearGhostIfFilled(){
    if (this.ghost && !this.freeSpot(this.ghost)){ this.ghost = null; this.ghostG.innerHTML = ''; }
  },
  markTwo(){
    this.markG.innerHTML = '';
    const comps = this.components(); comps.sort((a, b) => b.length - a.length);
    const inChain = new Set((comps[0] && comps[0].length > 1) ? comps[0].map(p => p.i) : []);
    const free = this.st.poses.map((p, i) => ({ i, r:normRot(p.rot) })).filter(p => !inChain.has(p.i));
    const up = free.find(p => p.r === 0), dn = free.find(p => p.r === 180);
    let pick = (up && dn) ? [up.i, dn.i] : free.slice(0, 2).map(p => p.i);
    if (pick.length < 2) pick = [0, 1];
    pick.forEach(i => {
      const pc = this.pieces[i]; pc.g.classList.add('hint-mark');
      const p = this.st.poses[i];
      S_('circle', { cx:p.x, cy:p.y, r:9, fill:COL.ink, class:'pulse' }, this.markG);
      line(this.markG, p.x + 10, p.y, p.x + 44, p.y, { stroke:COL.ink, 'stroke-width':2.5 });
      txt(this.markG, p.x + 50, p.y + 7, '尖端', { 'font-size':20, 'text-anchor':'start' });
    });
    const svg = this.svg;
    setTimeout(() => { if (this.svg !== svg) return; pick.forEach(i => this.pieces[i].g.classList.remove('hint-mark')); this.markG.innerHTML = ''; }, 6500);
    caption('看看這兩片：尖端的方向一樣嗎？');
  },
  hint(st){
    if (st.assembled){
      const q = this.questions[0];
      if (!st.ans.q1){ const t = tq(this, q); addHint(st, q.hints[Math.min(t.hintIdx, q.hints.length-1)]); t.hintIdx++; }
      else addHint(st, '已經拼好了！虛線外框就是近似的平行四邊形。');
      return;
    }
    st.hintLevel = (st.hintLevel || 0) + 1; save();
    if (st.hintLevel === 1){ addHint(st, '提示1：試著把兩片扇形的尖端朝不同方向，看看能不能靠在一起。'); this.markTwo(); }
    else if (st.hintLevel === 2){ addHint(st, '提示2：一片尖端朝上、一片尖端朝下，接著可以怎麼排？（看看下方的小示範）'); }
    else { if (st.hintLevel === 3) addHint(st, '提示3：淡色輪廓會標出「下一片」的位置；每按一次提示，只會出現一個位置。'); else toast('已標出下一片的位置'); this.showGhost(); }
  },
  panelTop(el, st){
    if (st.assembled) return;
    el.append(H('div', { class:'card' },
      H('p', { style:'margin:0 0 8px' }, '用手指拖曳扇形；也可以先點一片，再點想放的位置。選取後可用上方按鈕旋轉。'),
      H('button', { class:'btn primary', onclick:() => this.checkBtn() }, '我拼好了'),
      T.l2msg ? H('p', { class:'fb wrong' }, T.l2msg) : null));
    if ((st.hintLevel || 0) >= 2){
      const box = H('div', { class:'card' }, H('div', { class:'card-tag hint' }, '小示範'));
      const svg = S_('svg', { viewBox:'0 0 380 190', class:'mini-demo', role:'img', 'aria-label':'兩片扇形交錯排列的示範' });
      box.append(svg, H('p', { class:'note', style:'text-align:left' }, '示範只用兩片，主畫面還是要自己拼喔。'),
        H('button', { class:'btn small', onclick:() => this.playDemo(svg) }, '再看一次示範'));
      el.append(box);
      setTimeout(() => this.playDemo(svg), 50);
    }
  },
  async playDemo(svg){
    const id = ++demoId, alive = () => id === demoId;
    svg.innerHTML = '';
    const R = 80, a = Math.PI/8, C = 2*R*Math.sin(a), Hh = R*Math.cos(a), D = 2*R*Math.sin(a)/(3*a);
    const g = S_('g', {}, svg);
    const [p1, p2] = makePieces(g, 8, R, i => i ? 'b' : 'o', { sw:2.5 }).slice(0, 2);
    g.removeChild(g.lastChild); g.removeChild(g.lastChild); g.removeChild(g.lastChild); g.removeChild(g.lastChild); g.removeChild(g.lastChild); g.removeChild(g.lastChild);
    const A = { x:120, y:40, rot:0 };
    const B0 = { x:270, y:40, rot:0 };
    const c0 = { x:B0.x, y:B0.y + D };
    const B1 = { x:c0.x, y:c0.y + D, rot:180 };          // 繞重心轉 180°
    const B2 = { x:A.x + C/2, y:A.y + Hh, rot:180 };
    setPose(p1, A); setPose(p2, B0);
    const lab = txt(svg, 190, 182, '尖端朝上', { 'font-size':18, stroke:'none', fill:COL.muted });
    const step = (ms, fn) => new Promise(res => {
      if (reduceMotion){ fn(1); res(alive()); return; }
      const t0 = performance.now();
      const f = now => { if (!alive()){ res(false); return; } const k = Math.min(1, (now - t0)/ms); fn(ease(k)); if (k < 1) requestAnimationFrame(f); else res(true); };
      requestAnimationFrame(f);
    });
    for (let loop = 0; loop < 2; loop++){
      setPose(p2, B0); lab.textContent = '兩片都尖端朝上';
      if (!await step(700, () => {})) return;
      lab.textContent = '一片轉成尖端朝下';
      if (!await step(900, k => { const r = 180*k*Math.PI/180; setPose(p2, { x:c0.x + D*Math.sin(r), y:c0.y - D*Math.cos(r), rot:180*k }); })) return;
      lab.textContent = '靠過去，上下交錯';
      if (!await step(1000, k => setPose(p2, lerpPose(B1, B2, k)))) return;
      if (!await step(1100, () => {})) return;
    }
  },
  replay(){
    if (this.st.assembled){ this.drawOutline(true); caption('拼好的圖形：扇形保留弧邊，虛線是近似的外框。'); return; }
    this.pieces.forEach(p => pulse(p.body));
    caption('這 8 片扇形都來自同一個圓，大小完全相同。試著讓尖端上下交錯。');
  }
};

/* =========================================================
   第三關：切得越細，會發生什麼事？
   ========================================================= */
const L3 = {
  key:'l3', title:'切得越細，會發生什麼事？',
  think:'如果把圓切得更細，上下彎彎的邊會有什麼變化？',
  R:120, CX:185, CY:300, RX:640,
  ready: st => (st.viewed || []).length >= 2,

  questions:[{
    id:'q1', text:'切分的份數越[[0]]，每片扇形越細，拼出的上下邊越接近[[1]]線。', answers:[['多'],['直']], options:['多','少','直','曲'],
    clue:'比較 8 等份和 64 等份：哪一種的上下邊比較平？',
    clue2:'看畫面下方的數字：份數變多時，「弧邊起伏」變大還是變小？',
    hints:['切成 64 等份時，每片扇形是不是很細？','上下邊越來越平，就越像一條直線。'],
    praise:'答對了！份數越多，上下邊越接近直線。',
    onCorrect: () => L3.compare(),
    onWrong2: () => L3.compare()
  }],
  conclusion: () => '切得越細，拼出的圖形越接近平行四邊形。',
  mount(st){
    const svg = newStage(); this.svg = svg;
    txt(svg, this.CX, 90, '原來的圓', { 'font-size':22, fill:COL.muted, stroke:'none' });
    txt(svg, this.RX, 90, '交錯拼排', { 'font-size':22, fill:COL.muted, stroke:'none' });
    this.circG = S_('g', {}, svg); this.rowG = S_('g', {}, svg); this.olG = S_('g', { 'pointer-events':'none' }, svg);
    this.btns = {};
    toolsEl.append(H('span', { class:'tool-label' }, '切成：'));
    [8, 16, 32, 64].forEach(n => { const b = H('button', { class:'btn tool', onclick:() => this.choose(n) }, n + ' 等份'); this.btns[n] = b; toolsEl.append(b); });
    st.viewed = st.viewed || [];
    const first = !st.viewed.length;
    this.show(st.n || 8, first);
    if (first){ st.n = 8; st.viewed = [8]; save(); }
  },
  choose(n){
    const st = lvl(2); st.n = n;
    if (!st.viewed.includes(n)){ st.viewed.push(n); save(); if (st.viewed.length === 2) renderPanel(true); }
    save();
    this.show(n, true);
  },
  async show(n, animate, a){
    Object.keys(this.btns).forEach(k => this.btns[k].classList.toggle('primary', +k === n));
    const R = this.R;
    this.circG.innerHTML = ''; this.rowG.innerHTML = ''; this.olG.innerHTML = '';
    const sw = n >= 32 ? 0.8 : 2;
    const cp = circlePoses(n, this.CX, this.CY, 180/n, 0);
    makePieces(this.circG, n, R, i => i < n/2 ? 'o' : 'b', { sw }).forEach((p, i) => setPose(p, cp[i]));
    const L = rowLayout(n, R, this.RX, this.CY);
    const ps = makePieces(this.rowG, n, R, i => i < n/2 ? 'o' : 'b', { sw });
    const th = Math.PI/n;
    caption(`切成 <b>${n}</b> 等份：上下弧邊起伏 ≈ 半徑的 <b>${((1 - Math.cos(th))*100).toFixed(2)}%</b>｜直線的底 ≈ 半個圓周長的 ${(n*Math.sin(th)/Math.PI*100).toFixed(2)}%｜高 ≈ 半徑的 ${(Math.cos(th)*100).toFixed(2)}%（只會越來越接近，不會完全相等）`);
    if (animate){
      a = a || newAnim();
      ps.forEach((p, i) => setPose(p, cp[i]));

      let drag = null;

        if (ctx.done) return;

        e.preventDefault();
      });
      el.addEventListener('pointermove', e => {
        if (!drag || e.pointerId !== drag.id) return;
        if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8){
          drag.moved = true;
          const r = el.getBoundingClientRect();
          drag.fly = el.cloneNode(true); drag.fly.classList.add('flying');
          drag.fly.style.width = r.width + 'px'; drag.fly.style.height = r.height + 'px';
          drag.dx = e.clientX - r.left; drag.dy = e.clientY - r.top;
          document.body.appendChild(drag.fly); el.classList.add('ghosted');
        }
        if (drag.moved){
          drag.fly.style.left = (e.clientX - drag.dx) + 'px'; drag.fly.style.top = (e.clientY - drag.dy) + 'px';
          slots.forEach(s => s.classList.remove('target'));
          const hit = slotAt(e.clientX, e.clientY); if (hit) hit.classList.add('target');
        }
      });
      const end = e => {
        if (!drag || e.pointerId !== drag.id) return;
        const d = drag; drag = null;
        if (d.fly) d.fly.remove();
        el.classList.remove('ghosted');
        slots.forEach(s => s.classList.remove('target'));
        if (!d.moved){ t.selCard = !t.selCard; ctx.rerender(); return; }
        const hit = e.type === 'pointerup' ? slotAt(e.clientX, e.clientY) : null;
        if (hit && !t.slots[+hit.dataset.k]) place(+hit.dataset.k);
      };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
    }
    function slotAt(x, y){
      return slots.find(s => { const r = s.getBoundingClientRect(); return x >= r.left - 12 && x <= r.right + 12 && y >= r.top - 12 && y <= r.bottom + 12; }) || null;

/* =========================================================
   題目引擎：詞卡填空、選擇題、自訂題型
   ========================================================= */
function activeQ(L, st){
  if (L.ready && !L.ready(st)) return null;
  return L.questions.find(q => !st.ans[q.id]) || null;
}
function renderQuestion(L, q, st){
  const done = st.ans[q.id], t = tq(L, q);
  const card = H('div', { class:'card q' + (done ? ' is-done' : ''), id:'q-' + L.key + '-' + q.id });
  const rer = () => { const n = renderQuestion(L, q, st); card.replaceWith(n); };
  if (q.layer) card.append(H('div', { class:'card-tag' }, '第 ' + q.layer + ' 層'));
  if (q.type === 'custom'){
    q.mount(card, { st, done:!!done, t, rerender:rer, correct: v => markCorrect(L, q, st, v), wrong: () => { markWrong(L, q, st); rer(); } });
    appendFb(card, t, done);
    return card;
  }
  if (q.type === 'choice'){
    if (done) t.vals = done.slice();
    if (!t.vals) t.vals = [null];
    card.append(H('p', { class:'q-text' }, q.text));
    const list = H('div', { class:'choices' });
    q.options.forEach(o => {
      const sel = t.vals[0] === o;
      list.append(H('button', { class:'choice' + (sel ? ' sel' : '') + (done && sel ? ' ok' : ''), disabled: !!done,
        onclick:() => { t.vals = [o]; rer(); } }, (done && sel ? '✓ ' : '') + o));
    });
    card.append(list);
    if (!done) card.append(H('button', { class:'btn primary', disabled: t.vals[0] == null, onclick:() => check(L, q, st, t, rer) }, '檢查答案'));
    appendFb(card, t, done);
    return card;
  }
  const nB = q.answers.length;
  if (done) t.vals = done.slice();
  if (!t.vals || t.vals.length !== nB) t.vals = Array(nB).fill(null);
  if (t.active == null || t.active >= nB) t.active = 0;
  const ln = H('p', { class:'q-line' });
  q.text.split(/(\[\[\d\]\])/).forEach(part => {
    const m = part.match(/^\[\[(\d)\]\]$/);
    if (m){
      const bi = +m[1], v = t.vals[bi];
      ln.append(H('button', { class:'blank' + (v ? ' filled' : '') + (!done && t.active === bi ? ' active' : '') + (done ? ' ok' : ''),
        disabled: !!done, 'aria-label':'第 ' + (bi+1) + ' 格' + (v ? '：' + v : '，空白'),
        onclick:() => { if (v) t.vals[bi] = null; t.active = bi; rer(); } }, v || '　　'));
    } else if (part) ln.append(document.createTextNode(part));
  });
  card.append(ln);
  if (!done){
    const chips = H('div', { class:'chips' });
    q.options.forEach(o => chips.append(H('button', { class:'chip', onclick:() => {
      let a = t.active;
      if (a == null || t.vals[a] != null){ const e = t.vals.indexOf(null); if (e >= 0) a = e; }
      t.vals[a] = o;
      const nx = t.vals.indexOf(null); t.active = nx >= 0 ? nx : a;
      rer();
    } }, o)));
    card.append(chips);
    card.append(H('button', { class:'btn primary', disabled: t.vals.includes(null), onclick:() => check(L, q, st, t, rer) }, '檢查答案'));
  }
  appendFb(card, t, done);
  return card;
}
function appendFb(card, t, done){
  if (t.msg && (!done || t.msgType === 'ok')) card.append(H('p', { class:'fb ' + t.msgType }, t.msg));
}
function check(L, q, st, t, rer){
  const v = t.vals;
  let ok;
  if (q.unordered){ const want = q.answers.map(a => a[0]).sort(); ok = v.slice().sort().every((x, i) => x === want[i]); }
  else ok = v.every((x, i) => q.answers[i].includes(x));
  if (ok) markCorrect(L, q, st, q.canonical ? q.canonical.slice() : v.slice());
  else { markWrong(L, q, st); rer(); }
}
function markCorrect(L, q, st, vals){
  const t = tq(L, q);
  st.ans[q.id] = vals; t.vals = vals.slice();
  t.msg = q.praise || '答對了！'; t.msgType = 'ok';
  save();
  checkDone(L, st);
  renderPanel(true);
  if (q.onCorrect) q.onCorrect();
}
function markWrong(L, q, st){
  const t = tq(L, q);
  t.wrong = (t.wrong || 0) + 1; t.msgType = 'wrong';
  t.msg = t.wrong === 1 ? (q.clue || '再想想看。') : (q.clue2 || q.clue || '再試一次。');
  if (t.wrong >= 2 && q.onWrong2) q.onWrong2();
}
function checkDone(L, st){
  const allQ = L.questions.every(q => st.ans[q.id]);
  const extra = L.extraDone ? L.extraDone(st) : true;
  if (allQ && extra && !st.done && L !== L9){
    st.done = true; T['done:' + L.key] = true; save();
    toast(LEVELS.indexOf(L) === 7 ? '全部完成！按「下一步」領取證書。' : '本關完成！可以按「下一步」繼續。');
  }
}
function addHint(st, text){
  st.hints = st.hints || [];
  if (!st.hints.includes(text)){ st.hints.push(text); save(); renderPanel(); }
  const hc = panel.querySelector('.hint-card');
  if (hc){ hc.classList.remove('flash'); void hc.offsetWidth; hc.classList.add('flash'); hc.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block:'nearest' }); }
}
function doHint(){
  const i = S.current, L = LEVELS[i], st = lvl(i);
  if (L.hint){ L.hint(st); return; }
  const q = activeQ(L, st);
  if (q && q.hints && q.hints.length){
    const t = tq(L, q);
    addHint(st, q.hints[Math.min(t.hintIdx, q.hints.length - 1)]);
    if (t.hintIdx < q.hints.length) t.hintIdx++;
  } else if (L.ready && !L.ready(st)) addHint(st, L.waitText ? L.waitText(st) : '先看看畫面上的動畫。');
  else addHint(st, '這一關已經完成了！可以按「重播動畫」再看一次，或按「下一步」。');
}

/* =========================================================
   版面渲染與關卡切換
   ========================================================= */
function renderPanel(scroll){
  const i = S.current, L = LEVELS[i], st = lvl(i);
  panel.innerHTML = '';
  panel.append(H('div', { class:'card' }, H('div', { class:'card-tag think' }, '想一想'), H('p', { class:'think-text' }, L.think)));
  if (L.panelTop) L.panelTop(panel, st);
  const ready = !L.ready || L.ready(st);
  let active = null;
  if (ready){
    for (const q of L.questions){
      const el = renderQuestion(L, q, st);
      panel.append(el);
      if (!st.ans[q.id]){ active = el; break; }
    }
  } else if (L.waitText){ const w = L.waitText(st); if (w) panel.append(H('p', { class:'wait' }, w)); }
  if (st.hints && st.hints.length){
    panel.append(H('div', { class:'card hint-card' }, H('div', { class:'card-tag hint' }, '提示（可以重看）'),
      H('ol', { class:'hint-list' }, st.hints.map(h => H('li', {}, h)))));
  }
  let conclude = null;
  if (st.done && L.conclusion){
    const fresh = !!T['done:' + L.key]; delete T['done:' + L.key];
    const c = L.conclusion(st, fresh);
    conclude = H('div', { class:'card conclude' }, H('div', { class:'card-tag ok' }, '本關重點'), typeof c === 'string' ? H('p', {}, c) : c);
    panel.append(conclude);
  }
  updateChrome();
  if (scroll){
    const target = conclude || active;
    if (target) setTimeout(() => target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block:'nearest' }), 30);
  }
}
function updateChrome(){
  const i = S.current, L = LEVELS[i], st = lvl(i);
  $('#levelName').textContent = `第 ${i+1} 關：${L.title}`;
  const dots = $('#dots'); dots.innerHTML = '';
  LEVELS.forEach((lv, k) => {
    const open = unlocked(k), d = lvl(k).done || (k === 8 && open);
    dots.append(H('button', { class:'dot' + (open ? ' open' : '') + (d && k < 8 ? ' done' : '') + (k === i ? ' cur' : ''),
      'aria-label':`第 ${k+1} 關：${lv.title}` + (d && k < 8 ? '（已完成）' : open ? '' : '（尚未開放）'),
      onclick:() => { if (k === S.current) return; if (open) goto(k); else toast('先完成前面的關卡喔！'); } }, H('span', {}, d && k < 8 ? '✓' : String(k+1))));
  });
  $('#btnPrev').disabled = i === 0;
  const canNext = i < 8 && st.done;
  $('#btnNext').disabled = !canNext;
  $('#btnNext').classList.toggle('glow', canNext);
  $('#btnReset').disabled = i === 8;
}
function goto(i){
  animId++; demoId++; deriveId++;
  if (i < 0 || i >= LEVELS.length) return;
  if (!unlocked(i)) i = firstOpen();
  S.current = i; save();
  T.l2msg = '';
  const L = LEVELS[i], st = lvl(i);
  L.mount(st);
  renderPanel();
  panel.scrollTop = 0;
}
function firstOpen(){ for (let k = 0; k < LEVELS.length; k++) if (!lvl(k).done || k === 8) return k; return 8; }

$('#btnPrev').addEventListener('click', () => { if (S.current > 0) goto(S.current - 1); });
$('#btnNext').addEventListener('click', () => { if (S.current < 8 && lvl(S.current).done) goto(S.current + 1); });

$('#btnReset').addEventListener('click', async () => {

function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

async function ensureFonts(extra){

function csector(ctx, ax, ay, r, phi, th, fill, stroke, lw){

}
function cRowLayout(cx, cy, r, n){
  const L = rowLayout(n, r, cx, cy);

function spacedText(ctx, text, cx, y, spacing){

}
function drawBadge(ctx, cx, cy, R){

  ctx.strokeStyle = CC.gold; ctx.lineWidth = 2; ctx.strokeRect(76, 76, CW-152, CH-152);
  ctx.strokeStyle = CC.gold; ctx.lineWidth = 3;
  [[76,76,0],[CW-76,76,Math.PI/2],[CW-76,CH-76,Math.PI],[76,CH-76,Math.PI*1.5]].forEach(([x, y, a]) => {

  ctx.fillStyle = CC.muted; ctx.font = '400 26px ' + SANS; ctx.fillText('完成日期', 470, 1196); ctx.fillText('指導老師', 1530, 1196);
  ctx.fillStyle = CC.ink; ctx.font = '500 38px ' + SERIF; ctx.fillText(data.dateText || '', 470, 1250);

let celebId = 0;
function runCelebration(cv, onDone, instant){
  const id = ++celebId;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = cv.clientWidth || 600, Hc = cv.clientHeight || 340;
  cv.width = Math.round(W*dpr); cv.height = Math.round(Hc*dpr);
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = 16, th = 2*Math.PI/n, r = Math.min(W*0.15, Hc*0.3), cx = W/2, cy = Hc/2;
  const row = cRowLayout(cx, cy, r, n);
  const pieces = [];
  for (let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2, d = Math.max(W, Hc)*0.55;
    pieces.push({ start:{ x:cx + Math.cos(a)*d, y:cy + Math.sin(a)*d*0.6, phi:(i+0.5)*th + (Math.random()-0.5)*4 },
      circle:{ x:cx, y:cy, phi:(i+0.5)*th }, row:row.slots[i], color: i < n/2 ? CC.warmAnim : CC.coolAnim, delay:i*45 });
  }
  const sparks = Array.from({ length:36 }, () => ({ a:Math.random()*Math.PI*2, v:0.6 + Math.random()*1.2, hue: Math.random() < .5 ? CC.warmAnim : CC.coolAnim, s:2 + Math.random()*3 }));
  const T1 = 1100, HOLD = 600, T2 = 1300, T3 = 900, total = T1 + HOLD + T2 + T3;
  const t0 = performance.now(); let finished = false;
  function frame(now){
    if (id !== celebId || !cv.isConnected) return;
    const t = (reduceMotion || instant) ? total : now - t0;
    ctx.clearRect(0, 0, W, Hc);
    pieces.forEach(p => {
      let x, y, phi, alpha = 1;
      if (t < T1){
        const k = ease(Math.min(1, Math.max(0, (t - p.delay) / (T1 - 16*45 + 400))));
        x = lerp(p.start.x, p.circle.x, k); y = lerp(p.start.y, p.circle.y, k); phi = lerp(p.start.phi, p.circle.phi, k); alpha = Math.min(1, k*2.5);
      } else if (t < T1 + HOLD){ x = p.circle.x; y = p.circle.y; phi = p.circle.phi; }
      else { const k = ease(Math.min(1, (t - T1 - HOLD) / T2)); x = lerp(p.circle.x, p.row.x, k); y = lerp(p.circle.y, p.row.y, k); phi = lerp(p.circle.phi, p.row.phi, k); }
      ctx.globalAlpha = alpha; csector(ctx, x, y, r, phi, th, p.color, '#FFF8EA', 2);
    });
    ctx.globalAlpha = 1;
    const st = t - T1;
    if (st > 0 && st < 900){
      const k = st/900;
      sparks.forEach(s => { ctx.globalAlpha = 1 - k; ctx.fillStyle = s.hue; ctx.beginPath(); ctx.arc(cx + Math.cos(s.a)*(r + s.v*k*140), cy + Math.sin(s.a)*(r + s.v*k*140), s.s, 0, Math.PI*2); ctx.fill(); });
      ctx.globalAlpha = 1;
    }
    const lt = t - (T1 + HOLD + T2);
    if (lt > 0){
      const k = Math.min(1, lt/600); ctx.globalAlpha = k;
      const left = cx - row.width/2, right = cx + row.width/2, top = cy - row.height/2, bottom = cy + row.height/2;
      ctx.strokeStyle = '#6E6558'; ctx.fillStyle = '#4A4136'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(left, bottom + r - row.height/1 + 16); ctx.lineTo(right, bottom + r - row.height + 16); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(right + 16, top); ctx.lineTo(right + 16, bottom); ctx.stroke();
      const fs = Math.max(14, Math.round(W/44));
      ctx.font = '700 ' + fs + 'px ' + SANS; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('底 ≈ 圓周長的一半', cx, bottom + r - row.height + 24);
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('高 ≈ 半徑', right + 26, cy);
      ctx.globalAlpha = 1;
    }
    if (t >= T1 + HOLD + T2 + 400 && !finished){ finished = true; onDone && onDone(); }
    if (t < total) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------- 領取流程 ---------- */
const nameInput = $('#nameInput'), btnGenerate = $('#btnGenerate'), previewCanvas = $('#previewCanvas');
let current = null, previewTimer = 0;
function certData(name){ return { name, dateText: fmtDate(certStore.load().firstClearDate) }; }
async function renderPreview(){
  const name = cleanName(nameInput.value);
  btnGenerate.disabled = !name;
  await ensureFonts(name);
  const ctx = previewCanvas.getContext('2d');
  ctx.setTransform(previewCanvas.width/CW, 0, 0, previewCanvas.height/CH, 0, 0);
  drawCertificate(ctx, certData(name || '　'));
}
function openClaim(){
  if (!certComplete()) { toast('先完成全部關卡喔！'); return; }
  const st = certStore.load();
  nameInput.value = st.name || '';
  $('#stepName').hidden = false; $('#stepResult').hidden = true;
  $('#claimTitle').textContent = '寫上你的名字';
  $('#certOverlay').hidden = false; $('#certOverlay').scrollTop = 0;
  renderPreview();
}
$('#btnCloseCert').addEventListener('click', () => { $('#certOverlay').hidden = true; });
nameInput.addEventListener('input', () => {
  btnGenerate.disabled = !cleanName(nameInput.value);
  clearTimeout(previewTimer); previewTimer = setTimeout(renderPreview, 200);
});
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !btnGenerate.disabled){ nameInput.blur(); generate(); } });
async function generate(){
  const name = cleanName(nameInput.value);
  if (!name) return;
  btnGenerate.disabled = true; btnGenerate.textContent = '證書製作中…';
  try {
    const st = certStore.load(); st.name = name; certStore.save(st);
    await ensureFonts(name);
    const cv = document.createElement('canvas');
    cv.width = EXPORT_W; cv.height = Math.round(EXPORT_W*CH/CW);
    const ctx = cv.getContext('2d'); ctx.setTransform(cv.width/CW, 0, 0, cv.height/CH, 0, 0);
    drawCertificate(ctx, certData(name));
    const dataURL = cv.toDataURL('image/png');
    const blob = await new Promise(res => { try { cv.toBlob(res, 'image/png'); } catch(e){ res(null); } });
    const fileName = '圓面積探索家證書_' + name.replace(/[\\/:*?"<>|]/g, '') + '.png';
    if (current && current.blobURL) URL.revokeObjectURL(current.blobURL);
    current = { blob, fileName, blobURL: blob ? URL.createObjectURL(blob) : null, file:null };
    $('#resultImg').src = dataURL; $('#printImg').src = dataURL;
    let canShare = false;
    if (blob && navigator.share && navigator.canShare && typeof File === 'function'){
      try { current.file = new File([blob], fileName, { type:'image/png' }); canShare = navigator.canShare({ files:[current.file] }); } catch(e){ canShare = false; }
    }
    const canDownload = !!current.blobURL && ('download' in HTMLAnchorElement.prototype);
    $('#btnShare').hidden = !canShare; $('#btnDownload').hidden = !canDownload; $('#saveHint').hidden = canShare || canDownload;
    $('#stepName').hidden = true; $('#stepResult').hidden = false;
    $('#claimTitle').textContent = '你的證書完成了！';
    $('#certOverlay').scrollTop = 0;
  } finally {
    btnGenerate.textContent = '產生證書';
    btnGenerate.disabled = !cleanName(nameInput.value);
  }
}
btnGenerate.addEventListener('click', generate);
$('#btnEdit').addEventListener('click', () => { $('#stepResult').hidden = true; $('#stepName').hidden = false; $('#claimTitle').textContent = '寫上你的名字'; renderPreview(); nameInput.focus(); });
$('#btnDownload').addEventListener('click', () => {
  if (!current || !current.blobURL) return;
  const a = document.createElement('a'); a.href = current.blobURL; a.download = current.fileName;
  document.body.appendChild(a); a.click(); a.remove();
});
$('#btnShare').addEventListener('click', async () => {
  if (!current || !current.file) return;
  try { await navigator.share({ files:[current.file], title:'圓面積探索家通關證書' }); }
  catch(e){ if (e && e.name !== 'AbortError') $('#saveHint').hidden = false; }
});
$('#btnPrint').addEventListener('click', () => {
  const img = $('#printImg'), go = () => window.print();
  if (img.decode) img.decode().then(go, go); else go();
});

/* =========================================================
   螢幕旋轉／尺寸改變：SVG 依 viewBox 自動縮放；只需重畫畫布
   ========================================================= */
let resizeTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (S.current === 8 && L9.cv && L9.revealed) runCelebration(L9.cv, null, true); }, 200);
});

/* =========================================================
   封面：每次開啟先顯示；不透露最後的公式
   ========================================================= */
let coverId = 0;
function hasProgress(){
  if (S.current > 0) return true;
  return Object.keys(S.levels).some(k => { const l = S.levels[k]; return l.done || Object.keys(l.ans || {}).length || l.introSeen || l.poses; });
}
function showCover(){
  animId++; demoId++; deriveId++;
  const box = $('#coverActions'); box.innerHTML = '';
  if (hasProgress()){
    const i = unlocked(S.current) ? S.current : firstOpen();
    box.append(
      H('button', { class:'btn primary', onclick:() => startFromCover(i) }, `繼續第 ${i+1} 關 ▶`),
      H('button', { class:'btn', onclick:async () => {
        const ok = await confirmDialog('要從頭開始嗎？', '所有關卡的進度、填答、姓名與證書紀錄都會清除。', '全部清除並從頭開始');
        if (!ok) return;
        try { localStorage.removeItem(KEY); localStorage.removeItem(CERT_KEY); } catch(e){}
        S = freshState(); T = {}; startFromCover(0);
      } }, '從頭開始'));
  } else {
    box.append(H('button', { class:'btn primary', onclick:() => startFromCover(0) }, '開始探索 ▶'));
  }
  $('#cover').hidden = false; $('#cover').scrollTop = 0;
  playCoverArt();
}
function startFromCover(i){
  coverId++;
  $('#cover').hidden = true;
  goto(i);
}
async function playCoverArt(){
  const id = ++coverId, alive = () => id === coverId;
  const svg = $('#coverArt'); svg.innerHTML = '';
  const n = 16, R = 118, cx = 260, cy = 175;
  S_('circle', { cx, cy, r:R, fill:'none', stroke:'#E3D7C3', 'stroke-width':2, 'stroke-dasharray':'5 7' }, svg);
  const g = S_('g', {}, svg);
  const ps = makePieces(g, n, R, i => i < n/2 ? 'o' : 'b', { sw:2 });
  const circ = circlePoses(n, cx, cy, 180/n, 0);
  const row = rowLayout(n, R, cx, cy).poses;
  const q = txt(svg, cx, 380, '圓的面積 ＝ ？', { 'font-size':34, fill:COL.ink });
  const step = (ms, fn) => new Promise(res => {
    if (reduceMotion){ fn(1); res(alive()); return; }
    const t0 = performance.now();
    const f = now => { if (!alive()){ res(false); return; } const k = Math.min(1, (now - t0)/ms); fn(k); if (k < 1) requestAnimationFrame(f); else res(true); };
    requestAnimationFrame(f);
  });
  const move = (from, to) => step(1700, k => { const T2 = 1700 + 30*(n-1), t = k*T2; ps.forEach((p, i) => setPose(p, lerpPose(from[i], to[i], ease(clamp01((t - i*30)/1700))))); });
  ps.forEach((p, i) => setPose(p, circ[i]));
  if (reduceMotion){ ps.forEach((p, i) => setPose(p, row[i])); return; }
  while (alive()){
    if (!await step(1400, () => {})) return;
    if (!await move(circ, row)) return;
    if (!await step(2200, () => {})) return;
    if (!await move(row, circ)) return;
  }
}
$('#btnCover').addEventListener('click', showCover);

/* 測試用：讓自動化測試讀取狀態（不影響使用） */
window.__lesson = { state: () => S, goto, levels: LEVELS };

showCover();
})();
